[workspace]
resolver = "2"
members = [
    "client",
    "core",
    "fusionamm-sdk",
    "macros",
    "tx-sender",
]

# Shared dependencies for workspace members
[workspace.dependencies]
# Solana dependencies
solana-sdk = "2.1.0"
solana-program = "2.1.0"
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"

# Serialization
borsh = "1.5"
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
num-traits = "0.2"
num-derive = "0.4"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
